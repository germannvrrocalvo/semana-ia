name: Edición semanal

# Cada lunes por la mañana. El robot recopila las noticias de la semana anterior
# y publica la edición directamente en main. El filtro es `npm run build`: si el
# esquema rechaza la edición, el trabajo falla y no se publica nada.
#
# Cuatro horarios el mismo lunes, no uno. GitHub descarta disparos por cron
# cuando hay carga, y los que entrega llegan tarde: las dos ejecuciones que han
# llegado hasta ahora estaban puestas a las 06:00 y a las 06:23, y aterrizaron a
# las 13:14 y a las 13:02. Con cuatro intentos basta con que entre cualquiera; el
# primero que encuentra la edición sin publicar la publica y los siguientes ven
# que ya está y terminan sin hacer nada.
#
# El primero se pone a las 00:05 para que la edición salga por la mañana en
# España. Con el retraso observado, aterrizaría sobre las 07:00 UTC. Si resulta
# que GitHub no acumula un retraso fijo sino que reparte los disparos a una hora
# concreta del día, seguirá saliendo a mediodía y habrá que buscarlo por otra
# vía; lo dirá la primera ejecución con este horario.
#
# De paso, arrancar a las 00:05 del lunes encaja mejor con la semana que se
# publica: la ventana de siete días cubre el lunes anterior al domingo y ya no se
# cuela en la edición lo publicado el propio lunes por la mañana.
on:
  schedule:
    - cron: '5 0 * * 1'
    - cron: '5 2 * * 1'
    - cron: '23 6 * * 1'
    - cron: '23 13 * * 1'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás que se recopilan'
        required: false
        default: '7'
      forzar:
        description: 'Sobrescribir la edición si ya existe'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: edicion-semanal
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Si un cambio en los filtros vuelve a dejar pasar un articulo de ofertas,
      # la edicion no se genera. Son casos fijos, sin red: no pueden fallar por
      # que una fuente este caida.
      - name: Comprobar los filtros
        run: npm run probar

      - name: Generar la edición
        id: edicion
        env:
          # Opcional. Sin esta clave la edición se genera igual, con el extracto
          # original de cada fuente en lugar de un resumen redactado.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/build-issue.mjs \
            --dias "${{ inputs.dias || 7 }}" \
            ${{ inputs.forzar && '--forzar' || '' }} \
            ${{ github.event_name == 'schedule' && '--omitir-si-existe' || '' }}

      - name: Comprobar que el sitio sigue compilando
        if: steps.edicion.outputs.omitida != '1'
        run: npm run build

      - name: Publicar la edición
        if: steps.edicion.outputs.omitida != '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/ediciones/
          # Una ejecución que no cambia nada no deja un commit vacío detrás.
          if git diff --cached --quiet; then
            echo 'Sin cambios en las ediciones; no se publica nada.'
            exit 0
          fi
          git commit -m 'Edición ${{ steps.edicion.outputs.semana }} (${{ steps.edicion.outputs.noticias }} noticias)'
          git push
